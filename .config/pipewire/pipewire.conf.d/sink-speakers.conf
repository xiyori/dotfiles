# Convolver sink
#
# Copy this file into a conf.d/ directory such as
# ~/.config/pipewire/filter-chain.conf.d/
#
# Adjust the paths to the convolver files to match your system
#
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Q1 Meta Main"
            media.name       = "Q1 Meta Main"
            filter.graph = {
                nodes = [
                    {   type = builtin label = copy name = copyFL  }
                    {   type = builtin label = copy name = copyFR  }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = roomEQ
                        config = {
                            filename = "/home/sergej/.config/myeffects/q1_meta_main_eq.txt"
                        }
                    }
                    {
                        type   = builtin
                        label  = mixer
                        name   = sb1000Mix
                        control = {
                          "Gain 1" = 1.0
                          "Gain 2" = 1.0
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = q1metaDelayL
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.0006
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = q1metaDelayR
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.0006
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = sb1000DelayL
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.0015
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = q1metaFilter
                        config = {
                            filters = [
                                { type = bq_highpass, freq = 80, gain = 0, q = 0.707 },
                                { type = bq_highpass, freq = 80, gain = 0, q = 0.707 },
                            ]
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = sb1000Filter
                        config = {
                            filters1 = [
                                { type = bq_allpass, freq = 30, gain = 0, q = 0.707 },
                                { type = bq_lowpass, freq = 80, gain = 0, q = 0.707 },
                                { type = bq_lowpass, freq = 80, gain = 0, q = 0.707 },
                            ]
                            filters2 = [
                                { type = bq_lowpass, freq = 40, gain = 0, q = 0.541196 },
                                { type = bq_lowpass, freq = 40, gain = 0, q = 1.306563 },
                                { type = bq_lowpass, freq = 80, gain = 0, q = 0.707 },
                                { type = bq_lowpass, freq = 80, gain = 0, q = 0.707 },
                            ]
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = q1metaGain
                        config = {
                            filename = "/home/sergej/.config/myeffects/q1_meta_gain.txt"
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = sb1000Gain
                        config = {
                            filename = "/home/sergej/.config/myeffects/sb-1000_gain.txt"
                        }
                    }
                ]
                links = [
                    { output = "copyFL:Out" input="roomEQ:In 1" }
                    { output = "copyFR:Out" input="roomEQ:In 2" }
                    { output = "roomEQ:Out 1" input="q1metaFilter:In 1" }
                    { output = "roomEQ:Out 2" input="q1metaFilter:In 2" }
                    { output = "q1metaFilter:Out 1" input="q1metaDelayL:In" }
                    { output = "q1metaFilter:Out 2" input="q1metaDelayR:In" }
                    { output = "q1metaDelayL:Out" input="q1metaGain:In 1" }
                    { output = "q1metaDelayR:Out" input="q1metaGain:In 2" }
                    { output = "roomEQ:Out 1" input="sb1000Mix:In 1" }
                    { output = "roomEQ:Out 2" input="sb1000Mix:In 2" }
                    { output = "sb1000Mix:Out" input="sb1000Filter:In 1" }
                    { output = "sb1000Mix:Out" input="sb1000Filter:In 2" }
                    { output = "sb1000Filter:Out 1" input="sb1000DelayL:In" }
                    { output = "sb1000DelayL:Out" input="sb1000Gain:In 1" }
                    { output = "sb1000Filter:Out 2" input="sb1000Gain:In 2" }
                ]
                inputs  = [ "copyFL:In" "copyFR:In" ]
                outputs = [ "q1metaGain:Out 1" "q1metaGain:Out 2" "sb1000Gain:Out 1" "sb1000Gain:Out 2"  ]
            }
            capture.props = {
                node.name      = "Q1 Meta Main"
                media.class    = Audio/Filter
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "Q1 Meta Main"
                media.class    = Audio/Source
                node.passive   = true
                audio.channels = 4
                audio.position = [ FL FR SL SR ]
            }
        }
    }
]
