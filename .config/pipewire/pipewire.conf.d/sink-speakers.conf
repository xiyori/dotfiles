# Convolver sink
#
# Copy this file into a conf.d/ directory such as
# ~/.config/pipewire/filter-chain.conf.d/
#
# Adjust the paths to the convolver files to match your system
#
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "R7 Main"
            media.name       = "R7 Main"
            filter.graph = {
                nodes = [
                    {
                        type   = builtin
                        label  = param_eq
                        name   = roomEQ
                        config = {
                            filename = "/home/sergej/.config/myeffects/r7_main_eq.txt"
                            # filters = [
                            #     { type = bq_peaking, freq = 1000, gain = 0, q = 0.707 },
                            # ]
                        }
                    }
                    {
                        type   = builtin
                        label  = mixer
                        name   = sb1000Mix
                        control = {
                          "Gain 1" = 1.0
                          "Gain 2" = 1.0
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = r7DelayL
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.0012
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = r7DelayR
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.0012
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = sb1000DelayL
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.00055
                        }
                    }
                    # {
                    #     type   = builtin
                    #     label  = param_eq
                    #     name   = r7Filter
                    #     config = {
                    #         filters = [
                    #             { type = bq_highpass, freq = 22, gain = 0, q = 0.541196 },
                    #             { type = bq_highpass, freq = 22, gain = 0, q = 1.306563 },
                    #             # { type = bq_allpass, freq = 80, gain = 0, q = 0.707 },
                    #             # { type = bq_highpass, freq = 80, gain = 0, q = 0.707 },
                    #             # { type = bq_peaking, freq = 1000, gain = 0, q = 0.707 },
                    #         ]
                    #     }
                    # }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = sb1000Filter
                        config = {
                            filters = [
                                { type = bq_lowpass, freq = 120, gain = 0, q = 0.541196 },
                                { type = bq_lowpass, freq = 120, gain = 0, q = 1.306563 },
                                # { type = bq_lowpass, freq = 80, gain = 0, q = 0.707 },
                                # { type = bq_lowpass, freq = 80, gain = 0, q = 0.707 },
                                # { type = bq_peaking, freq = 1000, gain = 0, q = 0.707 },
                            ]
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = r7Gain
                        config = {
                            filename = "/home/sergej/.config/myeffects/r7_gain.txt"
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = sb1000Gain
                        config = {
                            filename = "/home/sergej/.config/myeffects/sb-1000_gain.txt"
                            # filename1 = "/home/sergej/.config/myeffects/sb-1000_gain_L.txt"
                            # filename2 = "/home/sergej/.config/myeffects/sb-1000_gain_R.txt"
                        }
                    }
                ]
                links = [
                    { output = "roomEQ:Out 1" input="r7DelayL:In" }
                    { output = "roomEQ:Out 2" input="r7DelayR:In" }
                    # { output = "r7Filter:Out 1" input="r7DelayL:In" }
                    # { output = "r7Filter:Out 2" input="r7DelayR:In" }
                    { output = "r7DelayL:Out" input="r7Gain:In 1" }
                    { output = "r7DelayR:Out" input="r7Gain:In 2" }
                    # { output = "r7Filter:Out 1" input="r7Gain:In 1" }
                    # { output = "r7Filter:Out 2" input="r7Gain:In 2" }

                    { output = "roomEQ:Out 1" input="sb1000Mix:In 1" }
                    { output = "roomEQ:Out 2" input="sb1000Mix:In 2" }
                    { output = "sb1000Mix:Out" input="sb1000Filter:In 1" }
                    { output = "sb1000Filter:Out 1" input="sb1000DelayL:In" }
                    { output = "sb1000DelayL:Out" input="sb1000Gain:In 1" }
                    # { output = "sb1000Filter:Out 1" input="sb1000Gain:In 1" }
                    { output = "sb1000Filter:Out 1" input="sb1000Gain:In 2" }
                ]
                inputs  = [ "roomEQ:In 1" "roomEQ:In 2" ]
                outputs = [ "r7Gain:Out 1" "r7Gain:Out 2" "sb1000Gain:Out 1" "sb1000Gain:Out 2"  ]
            }
            capture.props = {
                node.name      = "R7 Main"
                media.class    = Audio/Filter
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "R7 Main"
                media.class    = Audio/Source
                node.passive   = true
                audio.channels = 4
                audio.position = [ FL FR SL SR ]
            }
        }
    }
]
