# Convolver sink
#
# Copy this file into a conf.d/ directory such as
# ~/.config/pipewire/filter-chain.conf.d/
#
# Adjust the paths to the convolver files to match your system
#
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Home Theater"
            media.name       = "Home Theater"
            filter.graph = {
                nodes = [
                    {   type = builtin label = copy name = copyFC  }
                    {
                        type   = builtin
                        label  = mixer
                        name   = mixFL
                        control = {
                          "Gain 1" = 1.0
                          "Gain 2" = 0.7079457844
                        }
                    }
                    {
                        type   = builtin
                        label  = mixer
                        name   = mixFR
                        control = {
                          "Gain 1" = 1.0
                          "Gain 2" = 0.7079457844
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = frontEQ
                        config = {
                            filename = "/home/sergej/.config/myeffects/r7_theater_eq.txt"
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = rearEQ
                        config = {
                            filename = "/home/sergej/.config/myeffects/q1_meta_eq.txt"
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = lfeEQ
                        config = {
                            filename = "/home/sergej/.config/myeffects/sb-1000_eq.txt"
                        }
                    }
                    {
                        type   = builtin
                        label  = mixer
                        name   = sb1000Mix
                        control = {
                          "Gain 1" = 1.0
                          "Gain 2" = 1.0
                          "Gain 3" = 1.0
                          "Gain 4" = 1.0
                        }
                    }
                    {
                        type   = builtin
                        label  = mixer
                        name   = mixLFE
                        control = {
                          "Gain 1" = 1.0
                          "Gain 2" = 3.162  # 1.0 - calibrated same room curve as mains
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = r7DelayL
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.00052
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = r7DelayR
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.00052
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = sb1000DelayR
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.00012
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = q1metaDelayL
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.0012
                        }
                    }
                    {
                        type   = builtin
                        label  = delay
                        name   = q1metaDelayR
                        config = {
                            "max-delay" = 1
                        }
                        control = {
                            "Delay (s)" = 0.0012
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = q1metaFilter
                        config = {
                            filters = [
                                { type = bq_highpass, freq = 120, gain = 0, q = 0.541196 },
                                { type = bq_highpass, freq = 120, gain = 0, q = 1.306563 },
                            ]
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = sb1000Filter
                        config = {
                            filters = [
                                { type = bq_lowpass, freq = 120, gain = 0, q = 0.541196 },
                                { type = bq_lowpass, freq = 120, gain = 0, q = 1.306563 },
                            ]
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = r7Gain
                        config = {
                            filename = "/home/sergej/.config/myeffects/r7_gain.txt"
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = q1metaGain
                        config = {
                            filename = "/home/sergej/.config/myeffects/q1_meta_gain.txt"
                        }
                    }
                    {
                        type   = builtin
                        label  = param_eq
                        name   = sb1000Gain
                        config = {
                            filename = "/home/sergej/.config/myeffects/sb-1000_gain.txt"
                        }
                    }
                ]
                links = [
                    { output = "copyFC:Out" input="mixFL:In 2" }
                    { output = "copyFC:Out" input="mixFR:In 2" }
                    { output = "mixFL:Out" input="frontEQ:In 1" }
                    { output = "mixFR:Out" input="frontEQ:In 2" }
                    { output = "frontEQ:Out 1" input="r7DelayL:In" }
                    { output = "frontEQ:Out 2" input="r7DelayR:In" }
                    # { output = "r7Filter:Out 1" input="r7DelayL:In" }
                    # { output = "r7Filter:Out 2" input="r7DelayR:In" }
                    { output = "r7DelayL:Out" input="r7Gain:In 1" }
                    { output = "r7DelayR:Out" input="r7Gain:In 2" }

                    { output = "rearEQ:Out 1" input="q1metaFilter:In 1" }
                    { output = "rearEQ:Out 2" input="q1metaFilter:In 2" }
                    { output = "q1metaFilter:Out 1" input="q1metaDelayL:In" }
                    { output = "q1metaFilter:Out 2" input="q1metaDelayR:In" }
                    { output = "q1metaDelayL:Out" input="q1metaGain:In 1" }
                    { output = "q1metaDelayR:Out" input="q1metaGain:In 2" }

                    { output = "frontEQ:Out 1" input="sb1000Mix:In 1" }
                    { output = "frontEQ:Out 2" input="sb1000Mix:In 2" }
                    { output = "rearEQ:Out 1" input="sb1000Mix:In 3" }
                    { output = "rearEQ:Out 2" input="sb1000Mix:In 4" }
                    { output = "sb1000Mix:Out" input="sb1000Filter:In 1" }
                    { output = "sb1000Filter:Out 1" input="mixLFE:In 1" }
                    { output = "lfeEQ:Out 1" input="mixLFE:In 2" }
                    # { output = "lfeFilter:Out 1" input="mixLFE:In 2" }
                    { output = "mixLFE:Out" input="sb1000Gain:In 1" }
                    { output = "mixLFE:Out" input="sb1000DelayR:In" }
                    { output = "sb1000DelayR:Out" input="sb1000Gain:In 2" }
                ]
                inputs  = [ "mixFL:In 1" "mixFR:In 1" "copyFC:In" "lfeEQ:In 1" "rearEQ:In 1" "rearEQ:In 2" ]
                outputs = [ "r7Gain:Out 1" "r7Gain:Out 2" "sb1000Gain:Out 1" "sb1000Gain:Out 2" "q1metaGain:Out 1" "q1metaGain:Out 2" ]
            }
            capture.props = {
                node.name      = "Home Theater"
                media.class    = Audio/Sink
                audio.channels = 6
                audio.position = [ FL FR FC LFE SL SR ]
            }
            playback.props = {
                node.name      = "Home Theater"
                media.class    = Audio/Source
                node.passive   = true
                audio.channels = 6
                audio.position = [ FL FR SL SR RL RR ]
            }
        }
    }
]
