monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-MOTU_UltraLite-mk5*"
      }
    ]
    actions = {
      update-props = {
        # Force the driver profile parameters to match the high rates
        # api.alsa.period-size   = 48
        
        # Explicitly instruct the driver to probe higher sample formats 
        # matching Altset 3 parameters (typically S24_3LE or S32_LE at 192kHz)
        # audio.channels   = 10
        # audio.rate       = 176400
        
        # Enforce strict properties that block the node from negotiating down
        # node.force-rate  = 176400

        # device.profile.pro = true
        # api.alsa.use-acp   = true
        # api.acp.pro-channels = 10
      }
    }
  }
]
